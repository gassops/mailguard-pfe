apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml
  namespace: mailguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml
  template:
    metadata:
      labels:
        app: ml
    spec:
      containers:
        - name: ml
          image: mailguard-ml:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              # Relevé avec le passage de 2 à 4 workers gunicorn (Dockerfile) —
              # chaque worker charge sa propre copie du modèle en mémoire.
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
