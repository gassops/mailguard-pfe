apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: mailguard
spec:
  replicas: 1
  strategy:
    type: Recreate   # un seul pod peut monter le PVC ReadWriteOnce à la fois
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          resources:
            # MongoDB est sur le chemin de CHAQUE requête (authentification, blacklist, journalisation,
            # quota). Avec 500m de CPU et 512Mi (cache WiredTiger ≈ 256 Mo), il plafonnait dès 30 req/s
            # et ralentissait toute l'API : mesuré à 500m / 511Mi, soit exactement ses limites.
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc
