# Grafana — provisioning (datasource + dashboard) identique à monitoring/grafana/
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: mailguard
data:
  prometheus.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: mailguard
data:
  dashboard.yml: |
    apiVersion: 1

    providers:
      - name: 'MailGuard'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: mailguard
data:
  mailguard.json: |
    {
      "title": "MailGuard — API Overview",
      "uid": "mailguard-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Requêtes / sec",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum(rate(http_requests_total{job=\"mailguard-api\"}[5m]))", "legendFormat": "req/s" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 2,
          "title": "Latence p95",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"mailguard-api\"}[5m])) by (le))", "legendFormat": "p95" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.2 },
                  { "color": "red", "value": 0.5 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Taux d'erreur 5xx",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"mailguard-api\", status=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=\"mailguard-api\"}[5m]))",
              "legendFormat": "erreur"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.005 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Cache hit ratio",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "targets": [
            {
              "expr": "sum(increase(mailguard_cache_hits_total[15m])) / (sum(increase(mailguard_cache_hits_total[15m])) + sum(increase(mailguard_cache_misses_total[15m])))",
              "legendFormat": "hit ratio"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 0.6 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "title": "Débit de requêtes par statut",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [
            { "expr": "sum(rate(http_requests_total{job=\"mailguard-api\"}[5m])) by (status)", "legendFormat": "{{status}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 6,
          "title": "Latence p50 / p95 / p99",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=\"mailguard-api\"}[5m])) by (le))", "legendFormat": "p50" },
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"mailguard-api\"}[5m])) by (le))", "legendFormat": "p95" },
            { "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=\"mailguard-api\"}[5m])) by (le))", "legendFormat": "p99" }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        },
        {
          "id": 7,
          "title": "Répartition des verdicts",
          "type": "piechart",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 14 },
          "targets": [
            { "expr": "sum(increase(mailguard_verdicts_total[1h])) by (verdict)", "legendFormat": "{{verdict}}" }
          ]
        },
        {
          "id": 8,
          "title": "Cache : hits vs misses",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 14 },
          "targets": [
            { "expr": "sum(rate(mailguard_cache_hits_total[5m]))", "legendFormat": "hits" },
            { "expr": "sum(rate(mailguard_cache_misses_total[5m]))", "legendFormat": "misses" }
          ]
        },
        {
          "id": 9,
          "title": "Mémoire RSS — API Node.js",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 14 },
          "targets": [
            { "expr": "process_resident_memory_bytes{job=\"mailguard-api\"}", "legendFormat": "RSS" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] }
        }
      ]
    }
  mailguard-slo.json: |
    {
      "title": "MailGuard — SLO",
      "uid": "mailguard-slo",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "",
      "editable": true,
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "slo_p95",
            "label": "Objectif P95 (s)",
            "type": "custom",
            "query": "nominal (P95 < 200 ms) : 0.2,stress (P95 < 500 ms) : 0.5,spike (aucun SLO de latence) : 60",
            "hide": 0,
            "multi": false,
            "includeAll": false,
            "current": {
              "selected": true,
              "text": "nominal (P95 < 200 ms)",
              "value": "0.2"
            },
            "options": [
              {
                "selected": true,
                "text": "nominal (P95 < 200 ms)",
                "value": "0.2"
              },
              {
                "selected": false,
                "text": "stress (P95 < 500 ms)",
                "value": "0.5"
              },
              {
                "selected": false,
                "text": "spike (aucun SLO de latence)",
                "value": "60"
              }
            ]
          },
          {
            "name": "slo_cache",
            "label": "SLO cache",
            "type": "custom",
            "query": "évalué (trafic réel ou scénario cache) : 1,non évalué (adresses inédites - nominal / stress / spike) : 0",
            "hide": 0,
            "multi": false,
            "includeAll": false,
            "current": {
              "selected": true,
              "text": "évalué (trafic réel ou scénario cache)",
              "value": "1"
            },
            "options": [
              {
                "selected": true,
                "text": "évalué (trafic réel ou scénario cache)",
                "value": "1"
              },
              {
                "selected": false,
                "text": "non évalué (adresses inédites - nominal / stress / spike)",
                "value": "0"
              }
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "SLO 1 — Disponibilité (≥ 99,5 %)",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "100 * (1 - (sum(increase(http_requests_total{job=\"mailguard-api\",route=\"/verify\",status=~\"5..\"}[$__range])) or vector(0)) / sum(increase(http_requests_total{job=\"mailguard-api\",route=\"/verify\"}[$__range])))",
              "instant": true,
              "legendFormat": "valeur"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "mappings": [],
              "decimals": 3,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 99.5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 2,
          "title": "SLO 2 — Latence P95 mesurée",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 5,
            "y": 0
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (increase(http_request_duration_seconds_bucket{job=\"mailguard-api\",route=\"/verify\"}[$__range])))",
              "instant": true,
              "legendFormat": "valeur"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "mappings": [],
              "decimals": 3,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
