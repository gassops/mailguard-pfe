---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: mailguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mailguard-secrets
                  key: GF_ADMIN_PASSWORD
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            # Donnees ephemeres (emptyDir) : acceptable pour une demo locale —
            # les dashboards sont re-provisionnes automatiquement au demarrage
            # depuis les ConfigMaps ci-dessus, seule la conf UI custom se perdrait.
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              # 512Mi encore trop juste : 27 OOMKill cumulés (exit 137) observés
              # sous la charge des tests k6 + requêtes dashboard répétées.
              # 1Gi laisse une vraie marge (le nœud minikube a largement la place).
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          emptyDir: {}
