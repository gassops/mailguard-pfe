# Grafana — provisioning (datasource + dashboard) identique à monitoring/grafana/
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: mailguard
data:
  prometheus.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: mailguard
data:
  dashboard.yml: |
    apiVersion: 1

    providers:
      - name: 'MailGuard'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: mailguard
data:
  mailguard.json: |
    {
      "title": "MailGuard — API Overview",
      "uid": "mailguard-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Requêtes / sec",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum(rate(http_requests_total{job=\"mailguard-api\"}[5m]))", "legendFormat": "req/s" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 2,
          "title": "Latence p95",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"mailguard-api\"}[5m])) by (le))", "legendFormat": "p95" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.2 },
                  { "color": "red", "value": 0.5 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Taux d'erreur 5xx",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"mailguard-api\", status=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=\"mailguard-api\"}[5m]))",
              "legendFormat": "erreur"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.005 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Cache hit ratio",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "targets": [
            {
              "expr": "sum(increase(mailguard_cache_hits_total[15m])) / (sum(increase(mailguard_cache_hits_total[15m])) + sum(increase(mailguard_cache_misses_total[15m])))",
              "legendFormat": "hit ratio"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 0.6 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "title": "Débit de requêtes par statut",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [
            { "expr": "sum(rate(http_requests_total{job=\"mailguard-api\"}[5m])) by (status)", "legendFormat": "{{status}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 6,
          "title": "Latence p50 / p95 / p99",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=\"mailguard-api\"}[5m])) by (le))", "legendFormat": "p50" },
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"mailguard-api\"}[5m])) by (le))", "legendFormat": "p95" },
            { "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=\"mailguard-api\"}[5m])) by (le))", "legendFormat": "p99" }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        },
        {
          "id": 7,
          "title": "Répartition des verdicts",
          "type": "piechart",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 14 },
          "targets": [
            { "expr": "sum(increase(mailguard_verdicts_total[1h])) by (verdict)", "legendFormat": "{{verdict}}" }
          ]
        },
        {
          "id": 8,
          "title": "Cache : hits vs misses",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 14 },
          "targets": [
            { "expr": "sum(rate(mailguard_cache_hits_total[5m]))", "legendFormat": "hits" },
            { "expr": "sum(rate(mailguard_cache_misses_total[5m]))", "legendFormat": "misses" }
          ]
        },
        {
          "id": 9,
          "title": "Mémoire RSS — API Node.js",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 14 },
          "targets": [
            { "expr": "process_resident_memory_bytes{job=\"mailguard-api\"}", "legendFormat": "RSS" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: mailguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mailguard-secrets
                  key: GF_ADMIN_PASSWORD
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            # Donnees ephemeres (emptyDir) : acceptable pour une demo locale —
            # les dashboards sont re-provisionnes automatiquement au demarrage
            # depuis les ConfigMaps ci-dessus, seule la conf UI custom se perdrait.
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              # 256Mi mesuré en usage réel (kubectl top) contre une ancienne
              # limite à 256Mi → quasi 0 marge, probes qui timeout sous pression
              # mémoire, kubelet qui tue et boucle le pod. 512Mi laisse de la marge.
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          emptyDir: {}
