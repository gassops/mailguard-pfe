apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mailguard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Kubernetes n'a pas d'équivalent direct au depends_on de Docker Compose —
      # ces initContainers évitent un CrashLoopBackOff bruyant pendant que
      # MongoDB/Redis démarrent (connectMongo() fait process.exit(1) sinon).
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mongo 27017; do echo "attente de mongo..."; sleep 2; done']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do echo "attente de redis..."; sleep 2; done']
      containers:
        - name: api
          image: mailguard-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: mailguard-config
            - secretRef:
                name: mailguard-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
