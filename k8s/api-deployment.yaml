apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mailguard
spec:
  replicas: 4   # = minReplicas du HPA (hpa.yaml) : capacité de base dimensionnée pour la charge nominale
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Kubernetes n'a pas d'équivalent direct au depends_on de Docker Compose —
      # ces initContainers évitent un CrashLoopBackOff bruyant pendant que
      # MongoDB/Redis démarrent (connectMongo() fait process.exit(1) sinon).
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mongo 27017; do echo "attente de mongo..."; sleep 2; done']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do echo "attente de redis..."; sleep 2; done']
      containers:
        - name: api
          image: mailguard-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: mailguard-config
            - secretRef:
                name: mailguard-secrets
          resources:
            # Une vérification consomme ~25-45 ms de CPU (mesuré) : 100m de demande sous-estimait
            # le besoin réel de 3 à 4 fois (l'HPA voyait des pods « à 300 % »), et une limite de
            # 500m bridait le CPU (throttling) au moment des rafales, donc la latence.
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          # Sondes tolérantes : sous forte charge la boucle d'événements peut retarder la réponse
          # de /health de plus d'une seconde (timeout par défaut). Avec les valeurs par défaut,
          # les pods sortaient de l'Ingress (503) puis étaient redémarrés en plein pic, ce qui
          # aggravait la surcharge au lieu de la réduire.
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
