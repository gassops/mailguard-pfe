# Redis = cache pur, pas de PVC : la perte de données au redémarrage est
# acceptable (cohérent avec la stratégie fail-open de l'API — voir verify.js).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mailguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Cache pur : NI RDB NI AOF. Par défaut, l'image sauvegarde un RDB dès 10 000 écritures en
          # 60 s ; or le fork() de cette sauvegarde double la mémoire du conteneur. Sous charge, cela
          # dépassait la limite de 128 Mi : Redis se figeait, puis était tué (OOMKilled, code 137),
          # et TOUTE l'API, qui attend Redis à chaque requête, se figeait avec lui — mesuré : 200
          # requêtes bloquées 60 s en scénario de stress. Sans persistance, plus de fork.
          # maxmemory < limite du conteneur + éviction LRU : Redis expulse ses plus anciennes entrées
          # de cache au lieu de grossir jusqu'à être tué.
          command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "160mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 20
