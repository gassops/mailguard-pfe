# Alertmanager — config identique à monitoring/alertmanager.yml
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: mailguard
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: 'default'
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - match:
            severity: critical
          receiver: 'critical'

    receivers:
      # Récepteur par défaut — log uniquement (pas d'intégration externe pour ce projet)
      - name: 'default'

      # Récepteur "critical" — placeholder pour une intégration Slack/email en production
      # En PFE/local : les alertes critiques restent visibles dans l'UI Alertmanager (port 9093)
      - name: 'critical'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: mailguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:latest
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
