# Secret Kubernetes — valeurs sensibles, jamais commitées en clair en prod réelle.
# `stringData` encode automatiquement en base64 à l'application (kubectl apply) :
# pas besoin de le faire manuellement.
#
# Pour ce projet, MONGO_URI est traité comme sensible (chaîne de connexion =
# surface d'attaque potentielle) même sans identifiants, par bonne pratique.
apiVersion: v1
kind: Secret
metadata:
  name: mailguard-secrets
  namespace: mailguard
type: Opaque
stringData:
  MONGO_URI: "mongodb://mongo:27017/mailguard"
  GF_ADMIN_PASSWORD: "admin"
