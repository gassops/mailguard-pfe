# Les noms de Service ci-dessous (api, frontend, ml, mongo, redis) sont les noms
# DNS internes au cluster — ils DOIVENT correspondre exactement aux valeurs déjà
# utilisées dans le code (MONGO_URI=mongodb://mongo:..., REDIS_HOST=redis,
# ML_SERVICE_URL=http://ml:5000, nginx.conf proxy_pass http://api:3000/).
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mailguard
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mailguard
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: ml
  namespace: mailguard
spec:
  selector:
    app: ml
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: mailguard
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mailguard
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
---
# Observabilité — noms utilisés par prometheus.yml (alertmanager:9093) et par
# le datasource Grafana (http://prometheus:9090). Pas exposées via l'Ingress
# (outils admin, pas trafic applicatif) — accès via kubectl port-forward.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mailguard
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: mailguard
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: mailguard
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
