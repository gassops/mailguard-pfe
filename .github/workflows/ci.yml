name: CI

# Tout tourne sur les runners GitHub cloud (éphémères, jetables) — pas de
# runner auto-hébergé : ce repo est public, et un runner auto-hébergé sur un
# repo public est un risque de sécurité connu (une PR malveillante pourrait
# exécuter du code sur la machine qui héberge le runner). Le déploiement vers
# minikube reste donc une étape manuelle (voir README / commandes kubectl),
# lancée volontairement en local après un build réussi.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:

  # ── Tests API (Node.js) — Mongo/Redis réels en service containers ──────────
  test-api:
    name: Tests API (Node.js)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: npm ci
        working-directory: api
        run: npm ci

      - name: Jest (unitaires + intégration)
        working-directory: api
        run: npx jest

  # ── Tests ML (Python) — logique pure, pas de dépendance réseau ─────────────
  test-ml:
    name: Tests ML (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Dépendances
        working-directory: ml-service
        run: pip install -r requirements.txt pytest

      - name: Pytest
        working-directory: ml-service
        run: python -m pytest tests/test_train.py -q

  # ── Build + push vers ghcr.io — sur push ou déclenchement manuel (pas les PR) ─
  build-and-push:
    name: Build + push images
    needs: [test-api, test-ml]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Contexte = racine du repo (pas ./api) — api/Dockerfile a besoin
      # d'accéder à ml-service/datasets/ (voir importDomains.js).
      - name: Build + push — api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mailguard-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mailguard-api:latest

      # Le modèle ML est entraîné pendant ce build (voir ml-service/Dockerfile,
      # stage "trainer") — télécharge les datasets GitHub, ~30-60s.
      - name: Build + push — ml
        uses: docker/build-push-action@v5
        with:
          context: ./ml-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mailguard-ml:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mailguard-ml:latest

      - name: Build + push — frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mailguard-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mailguard-frontend:latest

      - name: Résumé
        run: |
          echo "Images publiées pour ce commit (${{ github.sha }}) :"
          echo "  ${{ env.REGISTRY }}/${{ github.repository_owner }}/mailguard-api:${{ github.sha }}"
          echo "  ${{ env.REGISTRY }}/${{ github.repository_owner }}/mailguard-ml:${{ github.sha }}"
          echo "  ${{ env.REGISTRY }}/${{ github.repository_owner }}/mailguard-frontend:${{ github.sha }}"
          echo ""
          echo "Déploiement manuel (voir README) :"
          echo "  kubectl -n mailguard set image deployment/api api=${{ env.REGISTRY }}/${{ github.repository_owner }}/mailguard-api:${{ github.sha }}"
